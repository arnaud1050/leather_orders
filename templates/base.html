<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Atelier Order Book{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='assets/css/style.css') }}">
</head>
<body>
  <nav class="view-switch">
    <a href="{{ url_for('index') }}" class="view-switch__link {{ 'is-active' if active_view == 'calendar' else '' }}">Calendar</a>
    <a href="{{ url_for('timeline_view') }}" class="view-switch__link {{ 'is-active' if active_view == 'timeline' else '' }}">Timeline</a>
  </nav>
  {% block content %}{% endblock %}
  <footer class="site-footer">
    <p>v0.0.1</p>
  </footer>
</body>
</html>
