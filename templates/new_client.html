{% extends "base.html" %}
{% block title %}New client — Atelier Order Book{% endblock %}
{% block content %}
<div class="ledger">

  <a class="back-link" href="{{ return_to }}">&larr; {{ back_label }}</a>

  <header class="detail-header">
    <h1>New client</h1>
    <p class="detail-subtitle">Create a client</p>
  </header>

  <form method="post" class="detail-form">
    <input type="hidden" name="return_to" value="{{ return_to }}">
    <label>First name<input type="text" name="first_name" required></label>
    <label>Last name<input type="text" name="last_name" required></label>
    <label>Email<input type="email" name="email"></label>
    <label>Phone<input type="tel" name="phone"></label>
    <p class="detail-note detail-form__note">Address and sources can be added from the client's full page afterwards.</p>
    <div>
      <button type="submit" class="btn-primary">Create client</button>
    </div>
  </form>

</div>
{% endblock %}
