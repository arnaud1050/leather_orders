services:
  demo:
    build:
      context: .
      dockerfile: Dockerfile.demo
    container_name: demo
    restart: unless-stopped
    ports:
      - "5555:5555"
    volumes:
      # Separate from ./data (used by docker-compose.yml) so this demo
      # deployment doesn't share a SQLite file with a local/other environment.
      - ./data-demo:/app/data
    environment:
      # Required — app.py falls back to an insecure default if this isn't
      # set. Put the real value in a local .env file (already gitignored)
      # rather than committing it here.
      - SECRET_KEY=${SECRET_KEY:-dev-not-secure}
      # Only used the first time this deployment's database is created
      # (seed_if_empty() in models.py) — sets the "admin" user's password.
      # Ignored on every subsequent start once ./data-demo/atelier.db exists.
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-changeme}
      # --- Communications module (see communications/) ---
      # Kept in sync by hand with docker-compose.yml, same as everything
      # else in these two files. Note the redirect URI differs: it has to
      # match the public URL this deployment is reached at, and be
      # registered on the Google OAuth client.
      - COMMS_ENCRYPTION_KEY=${COMMS_ENCRYPTION_KEY:-}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - GOOGLE_REDIRECT_URI=${GOOGLE_REDIRECT_URI:-https://demo.arnaudrouillot.com/integrations/google/callback}
      # One process only — see docker-compose.yml.
      - RUN_SCHEDULER=${RUN_SCHEDULER:-0}
      # --- AI module (see ai/) ---
      # Encrypts the vendor API keys saved under Settings → AI. See
      # docker-compose.yml for what it costs to leave unset.
      - AI_ENCRYPTION_KEY=${AI_ENCRYPTION_KEY:-}
      # This deployment sits behind nginx with TLS, so the session cookie
      # should be Secure by default here (unlike the local one).
      - SESSION_COOKIE_SECURE=${SESSION_COOKIE_SECURE:-1}
      # ...and for the same reason, honour X-Forwarded-Proto/-Host from that
      # nginx, so request.url reads https and the Google OAuth callback can
      # be parsed at all. Safe only because this container is unreachable
      # except through the proxy (no host port on website_network).
      - TRUST_PROXY_HEADERS=${TRUST_PROXY_HEADERS:-1}
    networks:
      - website_network

networks:
  # Pre-existing network shared with the nginx reverse proxy container, so
  # nginx can reach this container by name (demo:5555) without publishing
  # to the host. Must already exist on the server (created by whatever set
  # up the other sites on website_network).
  website_network:
    external: true
