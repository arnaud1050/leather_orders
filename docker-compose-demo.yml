services:
  demo:
    build:
      context: .
      dockerfile: Dockerfile.demo
    container_name: demo
    restart: unless-stopped
    ports:
      - "5555:5555"
    volumes:
      # Separate from ./data (used by docker-compose.yml) so this demo
      # deployment doesn't share a SQLite file with a local/other environment.
      - ./data-demo:/app/data
    # Its own env file — NOT the `.env` docker-compose.yml reads — so a
    # secret or bootstrap credential set for one deployment can never leak
    # into the other just because both compose files live in the same
    # checkout. Compose would otherwise auto-load a shared `.env` for both.
    # See .env.demo.example for the full list of variables this can set
    # (SECRET_KEY, ADMIN_EMAIL/PASSWORD, PLATFORM_ADMIN_EMAIL/PASSWORD,
    # COMMS_ENCRYPTION_KEY, GOOGLE_CLIENT_ID/SECRET, AI_ENCRYPTION_KEY,
    # RUN_SCHEDULER) — every one of them is optional in app.py, which falls
    # back to the same dev-only defaults documented there.
    env_file:
      - .env.demo
    environment:
      # Baked into this deployment on purpose, not read from .env.demo:
      # these describe *this* deployment's fixed identity
      # (demo.arnaudrouillot.com, TLS-terminated behind nginx), not a
      # secret — see docs/deployment.md.
      - GOOGLE_REDIRECT_URI=https://demo.arnaudrouillot.com/integrations/google/callback
      - SESSION_COOKIE_SECURE=1
      # Honour X-Forwarded-Proto/-Host from nginx, so request.url reads
      # https and the Google OAuth callback can be parsed at all. Only safe
      # when this container is unreachable except through the proxy —
      # which, as of the "5555:5555" above, it currently is NOT: that host
      # port bypasses nginx entirely, and anyone hitting it directly could
      # forge these headers themselves. Drop that port mapping (matching
      # docker-compose.yml) to close this, same as prod's own
      # TRUST_PROXY_HEADERS default had to wait on it.
      - TRUST_PROXY_HEADERS=1
    logging:
      driver: loki
      options:
        loki-url: "http://localhost:3100/loki/api/v1/push"
        loki-retries: "5"
        loki-batch-size: "400"
        mode: "non-blocking"
        max-buffer-size: "4m"
    networks:
      - website_network

networks:
  # Pre-existing network shared with the nginx reverse proxy container, so
  # nginx can reach this container by name (demo:5555) without publishing
  # to the host. Must already exist on the server (created by whatever set
  # up the other sites on website_network).
  website_network:
    external: true
