services:
  atelier-orders:
    build: .
    container_name: atelier-orders
    restart: unless-stopped
    volumes:
      # Persists /app/data (the SQLite file) across container rebuilds
      - ./data:/app/data
    environment:
      # Required for real deployments — app.py falls back to an insecure
      # default if this isn't set. Put the real value in a local .env file
      # (already gitignored) rather than committing it here.
      - SECRET_KEY=${SECRET_KEY:-dev-not-secure}
      # --- Communications module (see communications/) ---
      # All optional: unset, the app runs exactly as before and the
      # integrations page explains what's missing.
      #
      # Encrypts OAuth tokens at rest. Without it a key is derived from
      # SECRET_KEY, which means rotating SECRET_KEY makes every stored
      # token unreadable. Generate with:
      #   python -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())"
      - COMMS_ENCRYPTION_KEY=${COMMS_ENCRYPTION_KEY:-}
      # OAuth client from the Google Cloud console. The redirect URI must
      # match one registered on that client exactly. Defaulted here rather
      # than left for .env: docker-compose.yml and docker-compose-demo.yml
      # are run from the same checkout and so read the same .env file, and
      # a GOOGLE_REDIRECT_URI set there would apply to both, overriding
      # docker-compose-demo.yml's own default with this one. Baking each
      # deployment's correct value into its own compose file (as that file
      # already does) avoids the collision entirely.
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - GOOGLE_REDIRECT_URI=${GOOGLE_REDIRECT_URI:-https://atelier.arnaudrouillot.com/integrations/google/callback}
      # Background sync. Must be set on exactly ONE process — gunicorn runs
      # 2 workers here, and two schedulers would sync every mailbox twice.
      # Left off, "Sync now" on the integrations page still works.
      - RUN_SCHEDULER=${RUN_SCHEDULER:-0}
      # --- AI module (see ai/) ---
      # Encrypts the vendor API keys a company saves under Settings → AI.
      # Same fallback and same consequence as COMMS_ENCRYPTION_KEY above,
      # and generated the same way — a separate variable so either can be
      # rotated without invalidating the other's stored secrets.
      - AI_ENCRYPTION_KEY=${AI_ENCRYPTION_KEY:-}
      # TLS is live for atelier.arnaudrouillot.com (see docs/deployment.md),
      # so the session cookie should be Secure by default here too — same
      # reasoning as GOOGLE_REDIRECT_URI above for defaulting it in this
      # file rather than the .env shared with docker-compose-demo.yml.
      - SESSION_COOKIE_SECURE=${SESSION_COOKIE_SECURE:-1}
      # nginx (server_config repo) sets X-Forwarded-Proto/-Host, and this
      # container is reachable only through it now (no host port published
      # above) — so it's safe to trust them by default. Without this,
      # request.url inside the Google OAuth
      # callback reads "http://" (what gunicorn actually received) instead
      # of what the browser used, and oauthlib refuses to parse an http
      # authorization response at all ("OAuth 2 MUST utilize https") — see
      # the ProxyFix comment in app.py. Revisit to 0 only if a host port is
      # ever published again.
      - TRUST_PROXY_HEADERS=${TRUST_PROXY_HEADERS:-1}
    logging:
      driver: loki
      options:
        loki-url: "http://localhost:3100/loki/api/v1/push"
        loki-retries: "5"
        loki-batch-size: "400"
        mode: "non-blocking"
        max-buffer-size: "4m"
    networks:
      - website_network

networks:
  # Pre-existing network shared with the nginx reverse proxy container (see
  # server_config repo), so nginx can reach this container by name
  # (atelier-orders:5013) for atelier.arnaudrouillot.com. No host port is
  # published, so nginx is the only way in — unlike docker-compose-demo.yml,
  # which still also publishes 5555 directly (see docs/deployment.md).
  # Must already exist on the server.
  website_network:
    external: true
